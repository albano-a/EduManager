# EduManager Database Configuration
# Arquivo de configuração para conexão com o banco de dados MySQL

# Database Connection Properties
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/edumanager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user=root
db.password=17092013

# Pool Configuration
db.pool.initialSize=5
db.pool.maxActive=10
db.pool.maxIdle=5
db.pool.minIdle=2
db.pool.maxWait=30000

# SSL Configuration
db.useSSL=false
db.serverTimezone=UTC
db.allowPublicKeyRetrieval=true

# Character Set
db.characterEncoding=utf8mb4
db.useUnicode=true
